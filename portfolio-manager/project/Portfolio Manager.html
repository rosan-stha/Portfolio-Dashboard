<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Portfolio Manager V3.1</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap");
:root{--bg:#050816;--bg-deep:#03050f;--bg-radial-1:#0a1230;--bg-radial-2:#060a1c;--surface:rgba(15,23,42,0.85);--surface-2:rgba(20,28,50,0.85);--surface-3:rgba(28,38,62,0.75);--surface-solid:#0B1220;--border:rgba(148,163,184,0.10);--border-2:rgba(148,163,184,0.18);--border-glow:rgba(6,182,212,0.35);--text:#F8FAFC;--text-2:#CBD5E1;--muted:#64748B;--muted-2:#475569;--navy:#1E3A8A;--navy-2:#1E40AF;--blue:#3B82F6;--cyan:#06B6D4;--cyan-glow:rgba(6,182,212,0.55);--accent:#06B6D4;--pos:#22C55E;--pos-bg:rgba(34,197,94,0.10);--neg:#EF4444;--neg-bg:rgba(239,68,68,0.10);--warn:#F59E0B;--warn-bg:rgba(245,158,11,0.10);--grid:rgba(148,163,184,0.06);--shadow-lg:0 10px 40px -10px rgba(0,0,0,0.6),0 2px 8px rgba(0,0,0,0.4);--shadow-glow:0 0 0 1px rgba(59,130,246,0.15),0 10px 40px -8px rgba(59,130,246,0.25);--radius:12px;--radius-sm:8px;--radius-lg:16px}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(ellipse 1200px 600px at 20% -10%,rgba(30,58,138,0.30),transparent 60%),radial-gradient(ellipse 900px 500px at 100% 0%,rgba(6,182,212,0.12),transparent 55%),radial-gradient(ellipse 1000px 600px at 50% 100%,rgba(30,64,175,0.18),transparent 60%);background-attachment:fixed;color:var(--text);font-family:"Inter","SF Pro Display",system-ui,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.7 0 0 0 0 0.9 0 0 0 0.022 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");pointer-events:none;z-index:1;opacity:0.6}
#root{position:relative;z-index:2}
.font-display{font-family:"Space Grotesk","Inter",sans-serif;letter-spacing:-0.02em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,0.06),transparent 30%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card--glow{box-shadow:var(--shadow-lg),0 0 0 1px rgba(6,182,212,0.12),0 0 40px -8px rgba(6,182,212,0.20)}
.card--gradient-edge{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,rgba(59,130,246,0.45),rgba(6,182,212,0.25) 50%,rgba(30,58,138,0.10)) border-box}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 12px;font:500 12.5px/1 "Inter",sans-serif;border-radius:var(--radius-sm);cursor:pointer;transition:all 160ms ease}
.btn:hover{border-color:var(--border-2);background:var(--surface-3);transform:translateY(-1px)}
.btn--primary{background:linear-gradient(180deg,#1E40AF,#1E3A8A);border-color:rgba(59,130,246,0.4);box-shadow:0 6px 20px -6px rgba(59,130,246,0.5),inset 0 1px 0 rgba(255,255,255,0.12)}
.btn--primary:hover{background:linear-gradient(180deg,#2554d8,#1E40AF);box-shadow:0 10px 30px -6px rgba(59,130,246,0.7),inset 0 1px 0 rgba(255,255,255,0.18)}
.btn--ghost{background:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;letter-spacing:0.04em;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
.pill--pos{background:var(--pos-bg);color:var(--pos);border-color:rgba(34,197,94,0.25)}
.pill--neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(239,68,68,0.25)}
.pill--warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(245,158,11,0.25)}
.pill--cyan{background:rgba(6,182,212,0.12);color:var(--cyan);border-color:rgba(6,182,212,0.30)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chips{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);padding:3px;border-radius:var(--radius-sm);gap:2px}
.chip{border:0;background:transparent;color:var(--muted);padding:5px 10px;font:500 11.5px/1 "JetBrains Mono",monospace;letter-spacing:0.04em;border-radius:6px;cursor:pointer;transition:all 140ms}
.chip:hover{color:var(--text-2)}
.chip.active{background:linear-gradient(180deg,rgba(59,130,246,0.18),rgba(30,58,138,0.18));color:var(--text);box-shadow:inset 0 0 0 1px rgba(59,130,246,0.35),0 0 12px -4px rgba(59,130,246,0.5)}
.input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;font:13px/1.2 "Inter",sans-serif;border-radius:var(--radius-sm);outline:none;transition:all 160ms}
.input:focus{border-color:var(--border-glow);box-shadow:0 0 0 3px rgba(6,182,212,0.12)}
.input::placeholder{color:var(--muted-2)}
::selection{background:rgba(6,182,212,0.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.18);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.28);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos),0 0 16px rgba(34,197,94,0.5);animation:pulse-dot 1.6s ease-in-out infinite;display:inline-block}
@keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fade-up 400ms ease-out both}
table.term{width:100%;border-collapse:collapse}
table.term th{text-align:left;font:600 10px/1 "Inter",sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface-solid)}
table.term td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px}
table.term tr:hover td{background:rgba(59,130,246,0.04)}
table.term tr:last-child td{border-bottom:0}
/* ── Responsive / Mobile ── */
.mob-btn{display:none;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--text-2);width:34px;height:34px;min-width:34px;border-radius:8px;cursor:pointer;flex-shrink:0;padding:0}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:98;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.mob-overlay.vis{display:block}
.side-nav{overflow-y:auto;height:100vh;flex-shrink:0}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:rgba(6,10,22,0.97);border-top:1px solid var(--border);z-index:50;align-items:stretch;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media(max-width:900px){
  .kpi-grid{grid-template-columns:1fr 1fr 1fr!important}
  .grid-3{grid-template-columns:1fr 1fr!important}
  .grid-2-1{grid-template-columns:1fr!important}
}
@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr!important}
  .grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr!important}
  .hdr-period{display:none!important}
  .hdr-bell{display:none!important}
  .hdr-live{display:none!important}
  .hdr-div{display:none!important}
  .mob-btn{display:flex!important}
  .side-nav{position:fixed!important;top:0;left:0;z-index:99;height:100vh!important;transform:translateX(-240px);transition:transform 0.26s cubic-bezier(0.4,0,0.2,1)}
  .side-nav.open{transform:translateX(0)!important}
  .bnav{display:flex}
  .main-pad{padding:12px 12px 72px!important}
  header{padding:10px 14px!important}
  .term-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.term{min-width:560px}
}
  </style>
</head>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

  <!-- ── Default empty data ── -->
  <script>
  window.PORTFOLIO_DATA = (function() {

  <!-- ── Extended data ── -->
  <script>
  window.TERMINAL_DATA = (function() {
    var base = window.PORTFOLIO_DATA;
    function genSpark(seed, drift) {
      drift = drift || 0;
      var out=[],s=seed,v=100;
      for(var i=0;i<24;i++){s=(s*9301+49297)%233280;v*=1+drift+(s/233280-0.5)*0.012;out.push(v);}

    }
    var market = [
      {code:"TOPIX",  name:"TOPIX",      last:2842.18, day:0.0042,  region:"JP",   spark:genSpark(3,0.002)},

      {code:"SPX",    name:"S&P 500",    last:5842.12, day:0.0029,  region:"US",   spark:genSpark(17,0.001)},
      {code:"USDJPY", name:"USD/JPY",    last:156.42,  day:-0.0018, region:"FX",   spark:genSpark(19,-0.001)},
      {code:"VIX",    name:"VIX",        last:14.82,   day:0.0210,  region:"US",   spark:genSpark(23,0.01)},
      {code:"JP10Y",  name:"JGB 10Y",    last:1.428,   day:0.0140,  region:"Rate", unit:"%", spark:genSpark(29,0.007)},
      {code:"GOLD",   name:"Gold (¥/g)", last:14852,   day:0.0034,  region:"Comm", spark:genSpark(31,0.002)},

    var insights = [

       action:"Learn more"},
    ];
    var news = [
      {time:"--:--",src:"INFO",  text:"Upload your PayPay Securities Excel file to view your portfolio"},

      {time:"--:--",src:"TIP",   text:"Your data stays local — nothing is sent to any server"},

    return Object.assign({}, base, {

      risk:{sharpe:0,sortino:0,maxDD:0,volAnn:0,beta:0,alpha:0,var95:0,riskScore:0,riskLabel:"Upload Excel to start",winRate:0,avgWin:0,avgLoss:0,profitFactor:0},
      riskDecomp:   [],

      market:       market,

  window.__DEMO_DATA = window.TERMINAL_DATA;

  <!-- ── Excel Parser ── -->
  <script>
  window.parsePayPayExcel = function(workbook) {
    var PS_ALIASES = {
      company:      ["Company / Fund Name","Company name","Company Name","Company","銘柄名","銘柄"],
      total_bought: ["Total Bought (¥)","Total Bought","買付合計","購入合計"],
      total_sold:   ["Total Sold (¥)","Total Sold","売却合計"],
      net_invested: ["Net Invested (¥)","Net Invested","純投資額"],
      dividends:    ["Dividends / Dist. (¥)","Dividends (¥)","Dividends","配当金"],
      buy_trades:   ["Buy Trades","買付回数"],
      last_purchase:["Last Purchase","最終購入日"],
    };
    var TH_ALIASES = {
      date:   ["Date","日付","取引日"],
      company:["Company / Fund","Company/Fund","Company","Company Name","銘柄名"],
      amount: ["Amount (¥)","Amount","金額"],
      type_en:["Type (EN)","Type EN","Type_EN","Transaction Type","Type","取引種別"],
    };
    var DT_ALIASES = {
      company: ["Company / Fund","Company/Fund","Company","Company Name","銘柄名"],
      received:["Total Received (¥)","Total Received","配当合計"],
    };
    function parseSheet(name, headerRow) {
      var s = workbook.Sheets[name]; if (!s) return [];
      var all = XLSX.utils.sheet_to_json(s,{header:1,raw:false,defval:""});
      if (all.length <= headerRow) return [];
      var hdrs = (all[headerRow]||[]).map(function(h){return String(h||"").trim();});
      return all.slice(headerRow+1).map(function(row){
        var obj={};
        hdrs.forEach(function(h,i){if(h)obj[h]=String(row[i]||"").trim();});
        return obj;
      }).filter(function(r){return Object.values(r).some(function(v){return v!=="";});});
    }
    function remap(rows, aliases) {
      return rows.map(function(row){
        var out={};
        Object.entries(aliases).forEach(function(entry){
          var key=entry[0],names=entry[1];
          for(var i=0;i<names.length;i++){if(names[i] in row && row[names[i]]!==""){out[key]=row[names[i]];break;}}
        });
        return out;
      });
    }
    function num(s){return parseFloat(String(s||"0").replace(/,/g,""))||0;}
    function fmtN(n){return Math.round(n).toLocaleString();}
    var ps,th,dt;
    if(workbook.SheetNames.indexOf("Portfolio Summary")===-1){
      // ── Raw EN export branch (single "Transaction History" sheet) ───────────
      var rawWs=workbook.Sheets[workbook.SheetNames[0]];
      var rawAll=XLSX.utils.sheet_to_json(rawWs,{header:1,raw:false,defval:""});
      var hdrIdx=0;
      for(var ri=0;ri<Math.min(6,rawAll.length);ri++){if(rawAll[ri].some(function(c){return String(c).match(/Date|Stock/i);})){hdrIdx=ri;break;}}
      var rawHdrs=rawAll[hdrIdx].map(function(h){return String(h||"").trim();});
      var rawData=rawAll.slice(hdrIdx+1).map(function(row){var o={};rawHdrs.forEach(function(h,i){if(h)o[h]=String(row[i]||"").trim();});return o;}).filter(function(r){return Object.values(r).some(function(v){return v!=="";});});
      var TYPE_EN={"Buy":"Buy","Sell":"Sell","Dividend Payment":"Dividend","Distribution Payment":"Dividend"};
      th=[];
      rawData.forEach(function(r){
        var type_en=TYPE_EN[r["Description"]];if(!type_en)return;
        var company=String(r["Stock/Fund"]||"").trim();if(!company||company==="-")return;
        var amount=num(r["Order Amount (¥)"]);if(!amount)return;
        th.push({date:r["Date"],company:company,amount:amount,type_en:type_en});
      });
      var psMap={};
      th.forEach(function(r){
        if(!psMap[r.company])psMap[r.company]={company:r.company,total_bought:0,total_sold:0,dividends:0,buy_trades:0,last_purchase:"",net_invested:0};
        var p=psMap[r.company];
        if(r.type_en==="Buy"){p.total_bought+=r.amount;p.buy_trades++;if(!p.last_purchase||r.date>p.last_purchase)p.last_purchase=r.date;}
        else if(r.type_en==="Sell"){p.total_sold+=r.amount;}
        else if(r.type_en==="Dividend"){p.dividends+=r.amount;}
      });
      ps=Object.values(psMap).filter(function(r){return r.total_bought>0||r.total_sold>0||r.dividends>0;}).map(function(r){return Object.assign({},r,{net_invested:r.total_bought-r.total_sold});});
      var dtMap={};
      th.filter(function(r){return r.type_en==="Dividend";}).forEach(function(r){dtMap[r.company]=(dtMap[r.company]||0)+r.amount;});
      dt=Object.entries(dtMap).map(function(e){return{company:e[0],received:e[1]};}).filter(function(r){return r.received>0;}).sort(function(a,b){return b.received-a.received;});
    } else {
      // ── 3-sheet format branch ────────────────────────────────────────────────
      var psRaw=remap(parseSheet("Portfolio Summary",3),PS_ALIASES);
      var thRaw=remap(parseSheet("Transaction History",1),TH_ALIASES);
      var dtRaw=remap(parseSheet("Dividend Tracker",1),DT_ALIASES);
      ps=psRaw.filter(function(r){return r.company&&!String(r.company).match(/^[▶▼TOTAL合計]/);}).map(function(r){return{company:String(r.company||"").trim(),total_bought:num(r.total_bought),total_sold:num(r.total_sold),net_invested:num(r.net_invested),dividends:num(r.dividends),buy_trades:parseInt(String(r.buy_trades||"0").replace(/,/g,""))||0,last_purchase:r.last_purchase||""};}).filter(function(r){return r.company&&r.total_bought>0;});
      th=thRaw.filter(function(r){return r.date&&r.company;}).map(function(r){return{date:r.date,company:String(r.company||"").trim(),amount:num(r.amount),type_en:String(r.type_en||"").trim()};}).filter(function(r){return r.amount>0;});
      dt=dtRaw.filter(function(r){return r.company;}).map(function(r){return{company:String(r.company||"").trim(),received:num(r.received)};}).filter(function(r){return r.company&&r.received>0;}).sort(function(a,b){return b.received-a.received;});
    }
    var total_cost=ps.reduce(function(s,r){return s+r.total_bought;},0);
    var total_sold_sum=ps.reduce(function(s,r){return s+r.total_sold;},0);
    var total_net=ps.reduce(function(s,r){return s+r.net_invested;},0);
    var total_divs=ps.reduce(function(s,r){return s+r.dividends;},0);
    var total_trades=ps.reduce(function(s,r){return s+r.buy_trades;},0);
    var buyTxs=th.filter(function(r){return r.type_en.toLowerCase().includes("buy");}).length;
    var sellTxs=th.filter(function(r){return r.type_en.toLowerCase().includes("sell");}).length;
    function genSpark(seed,drift){drift=drift||0;var out=[],s=seed,v=100;for(var i=0;i<30;i++){s=(s*9301+49297)%233280;v*=1+drift+(s/233280-0.5)*0.022;out.push(v);}return out;}
    function genSeries(len,drift,vol,seed){var out=[],v=100,s=seed;for(var i=0;i<len;i++){s=(s*9301+49297)%233280;v*=1+drift+(s/233280-0.5)*vol;out.push(v);}return out;}

function Triangle2({up}){return(<svg width="9" height="9" viewBox="0 0 10 10" style={{display:"inline-block",verticalAlign:"middle"}}>{up?<path d="M5 1.5 L9 8 L1 8 Z" fill="currentColor"/>:<path d="M5 8.5 L9 2 L1 2 Z" fill="currentColor"/>}</svg>);}

  <script type="text/babel">

      </div>
      {card.delta?.v!=null&&(<div style={{marginTop:6,fontSize:12}}><span className={card.delta.v>=0?"pos":"neg"} style={{fontWeight:500}}>{card.delta.v>=0?"+":"−"}{fmtJPY(Math.abs(card.delta.v))}</span><span style={{color:"var(--muted)",marginLeft:8}}>{card.delta.label}</span></div>)}
      {!card.delta?.v&&card.delta?.label&&(<div style={{marginTop:6,fontSize:11.5,color:"var(--muted)"}}>{card.delta.label}</div>)}

function KpiGridPayPay({data,ccy}){
  const {total_cost,total_sold,total_net,total_div_annual,holdings,total_trades,dt,divYtd}=data;

  <!-- ── Charts ── -->
  <script type="text/babel">
function EquityCurve({data,ccy,period}){
  if(!data.equity||data.equity.length<2||data.equity.every(v=>v===0)){
    return(<div className="card card--glow" style={{display:"grid",placeItems:"center",height:200}}><div style={{color:"var(--muted)",fontSize:13}}>Upload Excel to see equity curve</div></div>);
  }
  const periodMap={"1D":5,"1W":5,"1M":22,"3M":66,"YTD":110,"1Y":252,"ALL":252};
  const n=periodMap[period]||252,equity=data.equity.slice(-n),topix=data.topixSeries.slice(-n).map(v=>v/data.topixSeries.slice(-n)[0]*equity[0]),nikkei=data.nikkeiSeries.slice(-n).map(v=>v/data.nikkeiSeries.slice(-n)[0]*equity[0]),dates=data.dates.slice(-n);
  const W=1000,H=320,PL=60,PR=18,PT=20,PB=32,innerW=W-PL-PR,innerH=H-PT-PB;
  const all=[...equity,...topix,...nikkei],minV=Math.min(...all),maxV=Math.max(...all),pad=(maxV-minV)*0.08,yMin=minV-pad,yMax=maxV+pad;
  const x=i=>PL+(i/(equity.length-1))*innerW,y=v=>PT+(1-(v-yMin)/(yMax-yMin))*innerH;

  <!-- ── Stock Analysis: UI Components ── -->
  <script type="text/babel">
const _G={GREEN:'#22C55E',RED:'#EF4444',BLUE:'#3B82F6',GOLD:'#F59E0B',CYAN:'#06B6D4'};
function fC(v,cur,compact){return window.fmtCurr(v,cur||'USD',compact);}
function fN(v,d=2){if(v==null||isNaN(+v))return'—';return(+v).toFixed(d);}
function fP(v){if(v==null||isNaN(+v))return'—';return(v*100).toFixed(1)+'%';}

/* ── SVG Bar Chart ─────────────────────────────────────────────── */
function FinBar({items,height=200,getColor,yFmt,title,showLine,lineItems,lineColor='#06B6D4'}){
  if(!items||!items.length)return<div style={{height,display:'grid',placeItems:'center',color:'var(--muted)',fontSize:12}}>No data</div>;
  const W=600,H=height,PL=62,PR=14,PT=14,PB=28,iW=W-PL-PR,iH=H-PT-PB;
  const fmt=yFmt||(v=>fC(v));
  const vals=items.map(d=>d.value).filter(v=>v!=null&&!isNaN(v));
  if(!vals.length)return null;
  const maxV=Math.max(...vals),minV=Math.min(...vals);
  const hasNeg=minV<0;
  const topV=hasNeg?Math.max(Math.abs(maxV),Math.abs(minV)):maxV||1;
  const range=hasNeg?topV*2:topV;
  const zeroY=PT+(hasNeg?1-topV/range:1)*iH;
  const bW=Math.floor(iW/items.length*0.62);
  const bX=i=>PL+(i+0.19)*(iW/items.length);
  const vY=v=>{if(v==null)return zeroY;const f=hasNeg?(v+topV)/range:v/topV;return PT+(1-f)*iH;};
  const ticks=Array.from({length:5},(_,i)=>{const v=hasNeg?i/4*range-topV:i/4*topV;return{v,y:PT+(1-i/4)*iH};});
  let lY=null;
  if(showLine&&lineItems&&lineItems.length){
    const lv=lineItems.map(d=>d.value).filter(v=>v!=null&&!isNaN(v));
    const lo=Math.min(...lv),lhi=Math.max(...lv)||1;
    lY=v=>PT+(1-(v-lo)/(lhi-lo||1))*iH;
  }
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      {ticks.map((t,i)=>(
        <g key={i}>
          <line x1={PL} x2={W-PR} y1={t.y} y2={t.y} stroke={Math.abs(t.v)<1?'rgba(148,163,184,0.18)':'rgba(148,163,184,0.06)'} strokeWidth={Math.abs(t.v)<1?1:0.5}/>
          <text x={PL-4} y={t.y+3.5} fontSize="9" textAnchor="end" fill="#64748B" fontFamily="JetBrains Mono,monospace">{fmt(t.v)}</text>
        </g>
      ))}
      {items.map((d,i)=>{
        if(d.value==null)return null;
        const col=getColor?getColor(d.value):_G.BLUE;
        const top=Math.min(zeroY,vY(d.value));
        const bH=Math.max(2,Math.abs(zeroY-vY(d.value)));
        return(
          <g key={i}>
            <rect x={bX(i)} y={top} width={bW} height={bH} fill={col} opacity="0.82" rx="2"/>
            <text x={bX(i)+bW/2} y={d.value>=0?top-3:top+bH+10} fontSize="8.5" textAnchor="middle" fill="#64748B" fontFamily="JetBrains Mono,monospace">{fmt(d.value)}</text>
            <text x={bX(i)+bW/2} y={H-4} fontSize="8.5" textAnchor="middle" fill="#64748B" fontFamily="JetBrains Mono,monospace">{d.label}</text>
          </g>
        );
      })}
      {lY&&lineItems&&(()=>{
        const pts=lineItems.filter(d=>d.value!=null&&!isNaN(d.value)).map((d,i)=>{
          const bi=items.findIndex(x=>x.label===d.label);
          const xi=bi>=0?bX(bi)+bW/2:PL+(i+0.5)*(iW/lineItems.length);
          return`${xi.toFixed(1)},${lY(d.value).toFixed(1)}`;
        });
        return pts.length>1?<polyline points={pts.join(' ')} fill="none" stroke={lineColor} strokeWidth="1.5" strokeDasharray="5 3" opacity="0.85" strokeLinecap="round" strokeLinejoin="round"/>:null;
      })()}
    </svg>
  );
}

/* ── SVG Multi-line Chart ───────────────────────────────────────── */
function FinLines({series,height=200,yFmt}){
  if(!series||!series.length)return null;
  const allV=series.flatMap(s=>s.items.map(d=>d.value).filter(v=>v!=null&&!isNaN(v)));
  if(!allV.length)return null;
  const W=600,H=height,PL=56,PR=14,PT=14,PB=28,iW=W-PL-PR,iH=H-PT-PB;
  const minV=Math.min(...allV),maxV=Math.max(...allV);
  const range=(maxV-minV)||1;
  const n=series[0].items.length;
  const xP=i=>PL+(i/(n-1||1))*iW;
  const yP=v=>PT+(1-(v-minV)/range)*iH;
  const fmt=yFmt||(v=>v.toFixed(1));
  const ticks=Array.from({length:5},(_,i)=>({v:minV+i/4*range,y:PT+(1-i/4)*iH}));
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      {ticks.map((t,i)=>(
        <g key={i}>
          <line x1={PL} x2={W-PR} y1={t.y} y2={t.y} stroke='rgba(148,163,184,0.07)' strokeWidth="0.5"/>
          <text x={PL-4} y={t.y+3.5} fontSize="9" textAnchor="end" fill="#64748B" fontFamily="JetBrains Mono,monospace">{fmt(t.v)}</text>
        </g>
      ))}
      {series[0].items.map((d,i)=>(i===0||i===n-1||i%Math.ceil(n/5)===0)&&(
        <text key={i} x={xP(i)} y={H-4} fontSize="8.5" textAnchor="middle" fill="#64748B" fontFamily="JetBrains Mono,monospace">{d.label}</text>
      ))}
      {series.map((s,si)=>{
        const pts=s.items.map((d,i)=>d.value!=null?`${xP(i).toFixed(1)},${yP(d.value).toFixed(1)}`:null).filter(Boolean);
        return pts.length>1?<polyline key={si} points={pts.join(' ')} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{filter:`drop-shadow(0 0 3px ${s.color})`}}/>:null;
      })}
    </svg>
  );
}

}
function ACard({title,sub,children,right}){

/* ── Quote Header ───────────────────────────────────────────────── */
function QuoteHeader({q,ticker,onWatch,inWatch}){
  const pos=q.changePct>=0;
  const sym=q.currency==='JPY'?'¥':'$';
  const r52=q.week52Hi>q.week52Lo?(q.price-q.week52Lo)/(q.week52Hi-q.week52Lo):0.5;
  return(
    <div className="card card--gradient-edge" style={{padding:'18px 20px',marginBottom:14}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div style={{display:'flex',gap:12,alignItems:'flex-start',flex:1,flexWrap:'wrap'}}>
          <div style={{width:44,height:44,borderRadius:10,background:'linear-gradient(135deg,#1E3A8A,#06B6D4)',display:'grid',placeItems:'center',fontSize:14,fontWeight:700,color:'white',flexShrink:0}}>{ticker.replace(/\.\w+$/,'').slice(0,2)}</div>
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <div className="font-display" style={{fontSize:17,fontWeight:700,lineHeight:1.2}}>{q.name}</div>
              <span className="pill pill--cyan" style={{fontSize:10}}>{ticker}</span>
              {q.exchangeName&&<span className="pill" style={{fontSize:10}}>{q.exchangeName}</span>}
            </div>
            {(q.sector||q.industry)&&<div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>{q.sector}{q.sector&&q.industry?' · ':''}{q.industry}</div>}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <div style={{textAlign:'right'}}>
            <div className="mono font-display" style={{fontSize:26,fontWeight:700,color:pos?_G.GREEN:_G.RED}}>{sym}{(+q.price).toLocaleString(undefined,{maximumFractionDigits:2})}</div>
            <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'flex-end',marginTop:2}}>
              <span className={pos?'pos':'neg'} style={{fontWeight:600,fontSize:13}}>{pos?'+':'−'}{Math.abs(q.change).toFixed(2)}</span>
              <span className={"pill "+(pos?"pill--pos":"pill--neg")}><Triangle2 up={pos}/> {(Math.abs(q.changePct)*100).toFixed(2)}%</span>
            </div>
          </div>
          <button onClick={onWatch} className="btn" style={{background:inWatch?'rgba(34,197,94,0.10)':'transparent',border:`1px solid ${inWatch?'rgba(34,197,94,0.35)':'var(--border)'}`,color:inWatch?_G.GREEN:'var(--text-2)',fontSize:12,padding:'7px 12px',flexShrink:0}}>
            {inWatch?'✓ Watching':'+ Watch'}
          </button>
        </div>
      </div>
      <div style={{marginTop:14,display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(100px,1fr))',gap:10}}>
        {[['Market Cap',fC(q.marketCap,q.currency)],['P/E (TTM)',q.pe?fN(q.pe):'—'],['Fwd P/E',q.forwardPe?fN(q.forwardPe):'—'],['EV/EBITDA',q.evEbitda?fN(q.evEbitda):'—'],['52W High',sym+(+q.week52Hi).toLocaleString(undefined,{maximumFractionDigits:2})],['52W Low',sym+(+q.week52Lo).toLocaleString(undefined,{maximumFractionDigits:2})]].map(([l,v])=>(
          <div key={l}><div style={{fontSize:9.5,color:'var(--muted)',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:3}}>{l}</div><div className="mono" style={{fontSize:13,fontWeight:600}}>{v}</div></div>
        ))}
      </div>
      {q.week52Hi>q.week52Lo&&(
        <div style={{marginTop:12}}>
          <div style={{height:4,background:'rgba(148,163,184,0.10)',borderRadius:2,position:'relative',overflow:'visible'}}>

            <div style={{position:'absolute',left:`${Math.min(98,Math.max(1,r52*100)).toFixed(1)}%`,top:'50%',width:8,height:8,background:'var(--cyan)',borderRadius:'50%',transform:'translate(-50%,-50%)',boxShadow:'0 0 8px var(--cyan)'}}/>

/* ── Financial tabs ─────────────────────────────────────────────── */
function RevenueTab({income,cur}){
  const rev=income.filter(d=>d.revenue!=null).map(d=>({label:d.date,value:d.revenue}));
  const gp=income.filter(d=>d.grossProfit!=null).map(d=>({label:d.date,value:d.grossProfit}));
  const yoy=rev.map((d,i)=>({label:d.label,value:i>0&&rev[i-1].value?(d.value/rev[i-1].value-1)*100:null}));
  return(<>
    <ACard title="Annual Revenue" sub="Total revenue (bar) + YoY growth % (dashed line)">
      <FinBar items={rev} getColor={()=>_G.BLUE} yFmt={v=>fC(v,cur)} showLine lineItems={yoy} lineColor={_G.GREEN}/>
      <ChartLegend items={[{name:'Revenue',color:_G.BLUE},{name:'YoY Growth %',color:_G.GREEN,dash:true}]}/>
    </ACard>
    <ACard title="Gross Profit" sub="Annual gross profit">
      <FinBar items={gp} getColor={()=>_G.CYAN} yFmt={v=>fC(v,cur)}/>
    </ACard>
  </>);
}
function EarningsTab({income,cur}){
  const ni=income.filter(d=>d.netIncome!=null).map(d=>({label:d.date,value:d.netIncome}));
  const eps=income.filter(d=>d.eps!=null).map(d=>({label:d.date,value:d.eps}));
  const epsYoy=eps.map((d,i)=>({label:d.label,value:i>0&&eps[i-1].value?(d.value/eps[i-1].value-1)*100:null}));
  const pn=v=>v>=0?_G.GREEN:_G.RED;
  const sym=cur==='JPY'?'¥':'$';
  return(<>
    <ACard title="Net Income" sub="Annual net income"><FinBar items={ni} getColor={pn} yFmt={v=>fC(v,cur)}/></ACard>
    <ACard title="EPS (Basic)" sub="Earnings per share + YoY growth % (dashed line)">
      <FinBar items={eps} getColor={pn} yFmt={v=>(v<0?'−':'')+sym+Math.abs(v).toFixed(2)} showLine lineItems={epsYoy} lineColor={_G.CYAN}/>
      <ChartLegend items={[{name:'EPS',color:_G.CYAN},{name:'YoY Growth %',color:_G.CYAN,dash:true}]}/>
    </ACard>
  </>);
}
function CashFlowTab({cashflow,cur}){
  const fcf=cashflow.map(d=>({label:d.date,value:d.fcf}));
  const opCF=cashflow.map(d=>({label:d.date,value:d.operatingCF}));
  const sbc=cashflow.map(d=>({label:d.date,value:d.sbc||0}));
  const fcfAfterSbc=cashflow.map(d=>({label:d.date,value:d.sbc?d.fcf-d.sbc:d.fcf}));
  const hasSBC=cashflow.some(d=>d.sbc&&d.sbc>0);
  const pn=v=>v>=0?_G.GREEN:_G.RED;
  return(<>
    <ACard title="Free Cash Flow" sub="Operating CF − CapEx  ·  green = positive, red = negative">
      <FinBar items={fcf} getColor={pn} yFmt={v=>fC(v,cur)}/>
    </ACard>
    {hasSBC&&<ACard title="FCF vs FCF after SBC" sub="Stock-Based Compensation (gold dashed) is a real cost">
      <FinBar items={fcfAfterSbc} getColor={v=>v>=0?'rgba(34,197,94,0.65)':'rgba(239,68,68,0.65)'} yFmt={v=>fC(v,cur)} showLine lineItems={sbc} lineColor={_G.GOLD}/>
      <ChartLegend items={[{name:'FCF after SBC',color:_G.GREEN},{name:'SBC',color:_G.GOLD,dash:true}]}/>
    </ACard>}
    <ACard title="Operating Cash Flow" sub="Annual cash from operations">
      <FinBar items={opCF} getColor={pn} yFmt={v=>fC(v,cur)}/>
    </ACard>
  </>);
}
function MarginsTab({income}){
  const mk=(key)=>income.filter(d=>d[key]!=null&&d.revenue).map(d=>({label:d.date,value:d[key]/d.revenue*100}));
  const series=[{name:'Gross Margin',color:_G.BLUE,items:mk('grossProfit')},{name:'Operating Margin',color:_G.CYAN,items:mk('operatingIncome')},{name:'Net Margin',color:_G.GREEN,items:mk('netIncome')}].filter(s=>s.items.length>0);
  return(<ACard title="Profit Margins" sub="Annual margins %">
    <FinLines series={series} height={230} yFmt={v=>v.toFixed(1)+'%'}/>
    <ChartLegend items={series}/>
  </ACard>);
}
function BalanceSheetTab({balanceSheet,cur}){
  const f=(k)=>balanceSheet.map(d=>({label:d.date,value:d[k]}));
  const de=balanceSheet.map(d=>({label:d.date,value:d.equity&&d.totalDebt?d.totalDebt/d.equity:null}));

/* ── DCF Calculator ─────────────────────────────────────────────── */
function DCFCalc({fcfPS,price,ncPS,currency}){
  const sym=currency==='JPY'?'¥':'$';
  const [fcf,setFcf]=React.useState(+(fcfPS||0).toFixed(2));
  const [nc,setNc]=React.useState(+(ncPS||0).toFixed(2));
  const [g1,setG1]=React.useState(15);
  const [g2,setG2]=React.useState(8);
  const [tg,setTg]=React.useState(3);
  const [dr,setDr]=React.useState(10);
  function calc(f,gr1,gr2,tgr,drate,ncp){
    const rows=[];let v=f;
    for(let yr=1;yr<=10;yr++){const g=(yr<=5?gr1:gr2)/100;v=v*(1+g);const pv=v/Math.pow(1+drate/100,yr);rows.push({yr,fcf:v,pv});}
    const tVal=(rows[9].fcf*(1+tgr/100))/Math.max(0.001,(drate/100)-(tgr/100));
    const tPV=tVal/Math.pow(1+drate/100,10);
    const sumPV=rows.reduce((s,r)=>s+r.pv,0);
    const intrinsic=sumPV+tPV+(ncp||0);
    const mos=price>0?(intrinsic-price)/price*100:0;
    return{rows,tPV,sumPV,intrinsic,mos,tvPct:(sumPV+tPV)>0?tPV/(sumPV+tPV)*100:0};
  }
  const res=calc(fcf,g1,g2,tg,dr,nc);
  const uv=res.intrinsic>price;
  const drs=[8,9,10,11,12],tgs=[2,2.5,3,3.5,4];
  const Slider=({label,val,set,min,max,step,suffix})=>(
    <div>
      <div style={{fontSize:9.5,color:'var(--muted)',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:5}}>{label}</div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <input type="number" value={val} step={step} onChange={e=>{const n=parseFloat(e.target.value);if(!isNaN(n))set(n);}} className="input mono" style={{width:'100%',fontSize:13,padding:'6px 10px'}}/>
        {suffix&&<span style={{fontSize:11,color:'var(--muted)',flexShrink:0}}>{suffix}</span>}
      </div>
      <input type="range" min={min} max={max} step={step} value={val} onChange={e=>set(parseFloat(e.target.value))} style={{width:'100%',marginTop:4,accentColor:'var(--cyan)'}}/>
    </div>
  );
  return(<div>
    <div className="card" style={{padding:'18px 20px',marginBottom:14}}>
      <div className="font-display" style={{fontSize:14,fontWeight:600,marginBottom:14}}>DCF Model Inputs</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:14}}>
        <div><div style={{fontSize:9.5,color:'var(--muted)',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:5}}>FCF / Share</div><input type="number" value={fcf} step="0.01" onChange={e=>setFcf(parseFloat(e.target.value)||0)} className="input mono" style={{width:'100%',fontSize:13,padding:'6px 10px'}}/></div>
        <div><div style={{fontSize:9.5,color:'var(--muted)',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:5}}>Net Cash / Share</div><input type="number" value={nc} step="0.01" onChange={e=>setNc(parseFloat(e.target.value)||0)} className="input mono" style={{width:'100%',fontSize:13,padding:'6px 10px'}}/></div>
        <Slider label="Growth Yr 1–5 %" val={g1} set={setG1} min={0} max={50} step={1} suffix="%"/>
        <Slider label="Growth Yr 6–10 %" val={g2} set={setG2} min={0} max={30} step={1} suffix="%"/>
        <Slider label="Terminal Growth %" val={tg} set={setTg} min={0} max={5} step={0.5} suffix="%"/>
        <Slider label="Discount Rate %" val={dr} set={setDr} min={5} max={20} step={1} suffix="%"/>
      </div>
    </div>
    <div className="card" style={{padding:'18px 20px',marginBottom:14}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14,marginBottom:14}}>
        {[['Intrinsic Value',sym+Math.abs(res.intrinsic).toFixed(2),uv?_G.GREEN:_G.RED],['Current Price',sym+(+price).toFixed(2),'var(--text)'],['Margin of Safety',(res.mos>=0?'+':'')+res.mos.toFixed(1)+'%',uv?_G.GREEN:_G.RED]].map(([l,v,c])=>(
          <div key={l}><div style={{fontSize:9.5,color:'var(--muted)',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:6}}>{l}</div><div className="mono font-display" style={{fontSize:24,fontWeight:700,color:c}}>{v}</div></div>
        ))}
      </div>
      <span className={"pill "+(uv?"pill--pos":"pill--neg")} style={{fontSize:12,marginBottom:14,display:'inline-flex'}}>{uv?'Undervalued':'Overvalued'} · TV = {res.tvPct.toFixed(1)}% of total value</span>
      <FinBar items={res.rows.map(r=>({label:'Y'+r.yr,value:r.fcf}))} getColor={()=>_G.BLUE} yFmt={v=>sym+Math.abs(v).toFixed(2)} showLine lineItems={res.rows.map(r=>({label:'Y'+r.yr,value:r.pv}))} lineColor={_G.CYAN} height={170}/>
      <ChartLegend items={[{name:'Projected FCF/share',color:_G.BLUE},{name:'Present Value',color:_G.CYAN,dash:true}]}/>
      <div style={{overflowX:'auto',marginTop:14}}>
        <table className="term" style={{minWidth:380}}>
          <thead><tr><th style={{textAlign:'left'}}>Year</th><th>Projected FCF</th><th>Present Value</th><th>Cumulative PV</th></tr></thead>
          <tbody>
            {res.rows.map((r,i)=>{const cum=res.rows.slice(0,i+1).reduce((s,x)=>s+x.pv,0);return(
              <tr key={r.yr}><td style={{textAlign:'left',color:'var(--cyan)',fontFamily:'JetBrains Mono,monospace',fontSize:12}}>{r.yr}</td><td className="mono" style={{textAlign:'right'}}>{sym}{r.fcf.toFixed(2)}</td><td className="mono" style={{textAlign:'right',color:_G.CYAN}}>{sym}{r.pv.toFixed(2)}</td><td className="mono" style={{textAlign:'right',color:'var(--text-2)'}}>{sym}{cum.toFixed(2)}</td></tr>
            );})}
            <tr style={{background:'rgba(6,182,212,0.06)'}}><td style={{textAlign:'left',fontWeight:600}}>Terminal</td><td className="mono" style={{textAlign:'right'}}>—</td><td className="mono" style={{textAlign:'right',color:_G.GOLD,fontWeight:600}}>{sym}{res.tPV.toFixed(2)}</td><td className="mono" style={{textAlign:'right',color:'var(--text)',fontWeight:600}}>{sym}{(res.sumPV+res.tPV).toFixed(2)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <ACard title="Sensitivity Analysis" sub="Intrinsic value · rows = Discount Rate, cols = Terminal Growth">
      <div style={{overflowX:'auto'}}>
        <table className="term" style={{minWidth:360}}>
          <thead><tr><th style={{textAlign:'left'}}>DR \ TG</th>{tgs.map(t=><th key={t}>{t}%</th>)}</tr></thead>
          <tbody>{drs.map(d=>(
            <tr key={d}><td style={{textAlign:'left',color:'var(--cyan)',fontFamily:'JetBrains Mono,monospace',fontSize:12}}>{d}%</td>
              {tgs.map(t=>{const r2=calc(fcf,g1,g2,t,d,nc);const match=d===dr&&t===tg;const u2=r2.intrinsic>price;return(
                <td key={t} className="mono" style={{textAlign:'right',fontSize:12,fontWeight:match?700:400,color:match?_G.GOLD:u2?_G.GREEN:_G.RED,background:match?'rgba(245,158,11,0.12)':'transparent',boxShadow:match?'inset 0 0 0 1px rgba(245,158,11,0.4)':undefined}}>{sym}{Math.abs(r2.intrinsic).toFixed(1)}</td>
              );})}
            </tr>
          ))}</tbody>
        </table>
      </div>
    </ACard>
  </div>);
}

      <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <Header period={period} setPeriod={setPeriod} ccy={ccy} setCcy={setCcy} asOf={data.asOf} onMenuClick={()=>setSideOpen(true)}/>
        <main className="main-pad" style={{flex:1,overflowY:"auto",padding:"20px 24px 32px",display:"flex",flexDirection:"column",gap:16}}>
          <NewsTicker data={data}/>
          {isEmpty?(
            <WelcomeScreen onUpload={handleWelcomeUpload}/>
          ):(
            <>
              {active==="dashboard"  && <Dashboard  data={data} ccy={ccy} period={period}/>}
              {active==="portfolio"  && <Portfolio  data={data} ccy={ccy} period={period}/>}
              {active==="analytics"  && <Analytics  data={data} ccy={ccy} period={period}/>}
              {active==="risk"       && <RiskView   data={data} ccy={ccy}/>}
              {active==="watchlist"  && <WatchView  data={data} ccy={ccy}/>}
              {active==="ai"         && <AIView     data={data} ccy={ccy}/>}
              {active==="backtest"   && <Backtest   data={data} ccy={ccy}/>}
              {active==="settings"   && <SettingsView data={data}/>}
              {active==="analysis"   && <AnalysisView/>}
            </>
          )}
        </main>
        <Footer asOf={data.asOf}/>
      </div>
      <BottomNav active={active} setActive={setActive}/>
    </div>
  );
}

function Dashboard({data,ccy,period}){
  return(<><KpiGrid data={data} ccy={ccy}/><div className="grid-2-1" style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}}><EquityCurve data={data} ccy={ccy} period={period}/><AIInsights data={data}/></div><div className="grid-3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}><AllocationDonut data={data} ccy={ccy}/><RiskDecomp data={data} ccy={ccy}/><MarketOverview data={data}/></div><HoldingsTerm data={data} ccy={ccy}/><div className="grid-2-1" style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}}><CorrelationHeatmap data={data}/><Watchlist data={data} ccy={ccy}/></div></>);
}
function Portfolio({data,ccy,period}){return(<><KpiGrid data={data} ccy={ccy}/><HoldingsTerm data={data} ccy={ccy}/><div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}><AllocationDonut data={data} ccy={ccy}/><RiskDecomp data={data} ccy={ccy}/></div></>);}
function Analytics({data,ccy,period}){return(<><KpiGrid data={data} ccy={ccy}/><EquityCurve data={data} ccy={ccy} period={period}/><div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}><CorrelationHeatmap data={data}/><RiskDecomp data={data} ccy={ccy}/></div></>);}
function RiskView({data,ccy}){return(<><KpiGrid data={data} ccy={ccy}/><div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}><RiskDecomp data={data} ccy={ccy}/><CorrelationHeatmap data={data}/></div></>);}
function WatchView({data,ccy}){return(<div className="grid-2-1" style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}}><Watchlist data={data} ccy={ccy}/><MarketOverview data={data}/></div>);}
function AIView({data,ccy}){return(<><AIInsights data={data}/><KpiGrid data={data} ccy={ccy}/></>);}
function Backtest(){return(<div className="card" style={{padding:40,textAlign:"center",maxWidth:560,margin:"0 auto"}}><div style={{width:52,height:52,borderRadius:14,background:"linear-gradient(135deg,#3B82F6,#06B6D4)",display:"grid",placeItems:"center",margin:"0 auto 18px",boxShadow:"0 0 28px -4px rgba(6,182,212,0.55)"}}>{I.backtest}</div><div className="font-display" style={{fontSize:18,fontWeight:600,marginBottom:8}}>Backtesting Engine</div><div style={{fontSize:13,color:"var(--muted)",lineHeight:1.6}}>Replay strategies against your historical Excel data with realistic transaction costs and tax modeling.</div><button className="btn btn--primary" style={{marginTop:18,padding:"10px 18px"}}>Coming soon</button></div>);}
function SettingsView(){
  const settings=[["Default currency","JPY (¥)"],["Excel schema","PayPay Securities v3.1"],["Price source","Yahoo Finance + 15-min delayed fallback"],["Tax rate (Tokutei)","20.315% (income + reconstruction surtax)"],["Risk-free rate","JGB 10Y · 1.428%"],["Benchmark","TOPIX (primary), Nikkei 225 (secondary)"]];
  return(<div className="card" style={{padding:24,maxWidth:760}}><div className="eyebrow" style={{marginBottom:8}}>System</div><div className="font-display" style={{fontSize:22,fontWeight:600,marginBottom:16}}>Preferences</div><div>{settings.map((s,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:i<settings.length-1?"1px solid var(--border)":"none"}}><span style={{color:"var(--text-2)"}}>{s[0]}</span><span className="mono" style={{color:"var(--text)"}}>{s[1]}</span></div>))}</div></div>);
}
function Footer({asOf}){
  return(<footer style={{padding:"18px 24px",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11,color:"var(--muted)",background:"rgba(5,8,22,0.4)"}}><div style={{display:"flex",alignItems:"center",gap:12}}><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span className="live-dot"/><span style={{color:"var(--text-2)"}}>All systems operational</span></span><span style={{color:"var(--muted-2)"}}>·</span><span>Data: PayPay Securities Excel</span><span style={{color:"var(--muted-2)"}}>·</span><span style={{color:"var(--warn)",fontWeight:500}}>Not financial advice</span></div><div className="mono" style={{fontSize:10.5}}>Portfolio Manager v3.1 · As of {asOf.toLocaleString("en-GB")} JST</div></footer>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
