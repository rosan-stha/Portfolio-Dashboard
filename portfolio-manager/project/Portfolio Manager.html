<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Portfolio Manager V3.1</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap");
:root{--bg:#050816;--bg-deep:#03050f;--bg-radial-1:#0a1230;--bg-radial-2:#060a1c;--surface:rgba(15,23,42,0.85);--surface-2:rgba(20,28,50,0.85);--surface-3:rgba(28,38,62,0.75);--surface-solid:#0B1220;--border:rgba(148,163,184,0.10);--border-2:rgba(148,163,184,0.18);--border-glow:rgba(6,182,212,0.35);--text:#F8FAFC;--text-2:#CBD5E1;--muted:#64748B;--muted-2:#475569;--navy:#1E3A8A;--navy-2:#1E40AF;--blue:#3B82F6;--cyan:#06B6D4;--cyan-glow:rgba(6,182,212,0.55);--accent:#06B6D4;--pos:#22C55E;--pos-bg:rgba(34,197,94,0.10);--neg:#EF4444;--neg-bg:rgba(239,68,68,0.10);--warn:#F59E0B;--warn-bg:rgba(245,158,11,0.10);--grid:rgba(148,163,184,0.06);--shadow-lg:0 10px 40px -10px rgba(0,0,0,0.6),0 2px 8px rgba(0,0,0,0.4);--shadow-glow:0 0 0 1px rgba(59,130,246,0.15),0 10px 40px -8px rgba(59,130,246,0.25);--radius:12px;--radius-sm:8px;--radius-lg:16px}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(ellipse 1200px 600px at 20% -10%,rgba(30,58,138,0.30),transparent 60%),radial-gradient(ellipse 900px 500px at 100% 0%,rgba(6,182,212,0.12),transparent 55%),radial-gradient(ellipse 1000px 600px at 50% 100%,rgba(30,64,175,0.18),transparent 60%);background-attachment:fixed;color:var(--text);font-family:"Inter","SF Pro Display",system-ui,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.7 0 0 0 0 0.9 0 0 0 0.022 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");pointer-events:none;z-index:1;opacity:0.6}
#root{position:relative;z-index:2}
.font-display{font-family:"Space Grotesk","Inter",sans-serif;letter-spacing:-0.02em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,0.06),transparent 30%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card--glow{box-shadow:var(--shadow-lg),0 0 0 1px rgba(6,182,212,0.12),0 0 40px -8px rgba(6,182,212,0.20)}
.card--gradient-edge{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,rgba(59,130,246,0.45),rgba(6,182,212,0.25) 50%,rgba(30,58,138,0.10)) border-box}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 12px;font:500 12.5px/1 "Inter",sans-serif;border-radius:var(--radius-sm);cursor:pointer;transition:all 160ms ease}
.btn:hover{border-color:var(--border-2);background:var(--surface-3);transform:translateY(-1px)}
.btn--primary{background:linear-gradient(180deg,#1E40AF,#1E3A8A);border-color:rgba(59,130,246,0.4);box-shadow:0 6px 20px -6px rgba(59,130,246,0.5),inset 0 1px 0 rgba(255,255,255,0.12)}
.btn--primary:hover{background:linear-gradient(180deg,#2554d8,#1E40AF);box-shadow:0 10px 30px -6px rgba(59,130,246,0.7),inset 0 1px 0 rgba(255,255,255,0.18)}
.btn--ghost{background:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;letter-spacing:0.04em;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
.pill--pos{background:var(--pos-bg);color:var(--pos);border-color:rgba(34,197,94,0.25)}
.pill--neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(239,68,68,0.25)}
.pill--warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(245,158,11,0.25)}
.pill--cyan{background:rgba(6,182,212,0.12);color:var(--cyan);border-color:rgba(6,182,212,0.30)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chips{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);padding:3px;border-radius:var(--radius-sm);gap:2px}
.chip{border:0;background:transparent;color:var(--muted);padding:5px 10px;font:500 11.5px/1 "JetBrains Mono",monospace;letter-spacing:0.04em;border-radius:6px;cursor:pointer;transition:all 140ms}
.chip:hover{color:var(--text-2)}
.chip.active{background:linear-gradient(180deg,rgba(59,130,246,0.18),rgba(30,58,138,0.18));color:var(--text);box-shadow:inset 0 0 0 1px rgba(59,130,246,0.35),0 0 12px -4px rgba(59,130,246,0.5)}
.input{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;font:13px/1.2 "Inter",sans-serif;border-radius:var(--radius-sm);outline:none;transition:all 160ms}
.input:focus{border-color:var(--border-glow);box-shadow:0 0 0 3px rgba(6,182,212,0.12)}
.input::placeholder{color:var(--muted-2)}
::selection{background:rgba(6,182,212,0.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.18);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.28);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos),0 0 16px rgba(34,197,94,0.5);animation:pulse-dot 1.6s ease-in-out infinite;display:inline-block}
@keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fade-up 400ms ease-out both}
table.term{width:100%;border-collapse:collapse}
table.term th{text-align:left;font:600 10px/1 "Inter",sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface-solid)}
table.term td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px}
table.term tr:hover td{background:rgba(59,130,246,0.04)}
table.term tr:last-child td{border-bottom:0}
/* ── Responsive / Mobile ── */
.mob-btn{display:none;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--text-2);width:34px;height:34px;min-width:34px;border-radius:8px;cursor:pointer;flex-shrink:0;padding:0}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:98;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.mob-overlay.vis{display:block}
.side-nav{overflow-y:auto}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:rgba(6,10,22,0.97);border-top:1px solid var(--border);z-index:50;align-items:stretch;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media(max-width:900px){
  .kpi-grid{grid-template-columns:1fr 1fr 1fr!important}
  .grid-3{grid-template-columns:1fr 1fr!important}
  .grid-2-1{grid-template-columns:1fr!important}
}
@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr!important}
  .grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr!important}
  .hdr-period{display:none!important}
  .hdr-bell{display:none!important}
  .hdr-live{display:none!important}
  .hdr-div{display:none!important}
  .mob-btn{display:flex!important}
  .side-nav{position:fixed!important;top:0;left:0;z-index:99;height:100vh!important;transform:translateX(-240px);transition:transform 0.26s cubic-bezier(0.4,0,0.2,1)}
  .side-nav.open{transform:translateX(0)!important}
  .bnav{display:flex}
  .main-pad{padding:12px 12px 72px!important}
  header{padding:10px 14px!important}
  .term-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.term{min-width:560px}
}
  </style>
</head>
<body>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

  <!-- ── Default empty data ── -->
  <script>
  window.PORTFOLIO_DATA = (function() {
    var flat60 = Array.from({length:60}, function(){return 100;});
    var today  = new Date();
    var dates  = Array.from({length:60}, function(_,i){ var d=new Date(today); d.setDate(d.getDate()-(59-i)); return d; });
    return {

  <!-- ── Extended data ── -->
  <script>
  window.TERMINAL_DATA = (function() {
    var base = window.PORTFOLIO_DATA;
    function genSpark(seed, drift) {
      drift = drift || 0;
      var out=[],s=seed,v=100;
      for(var i=0;i<24;i++){s=(s*9301+49297)%233280;v*=1+drift+(s/233280-0.5)*0.012;out.push(v);}
      return out;
    }
    var market = [
      {code:"TOPIX",  name:"TOPIX",      last:2842.18, day:0.0042,  region:"JP",   spark:genSpark(3,0.002)},
      {code:"NKY",    name:"Nikkei 225", last:39218.4, day:0.0061,  region:"JP",   spark:genSpark(7,0.003)},
      {code:"MOTHERS",name:"Mothers",    last:742.31,  day:-0.0083, region:"JP",   spark:genSpark(11,-0.004)},
      {code:"SPX",    name:"S&P 500",    last:5842.12, day:0.0029,  region:"US",   spark:genSpark(17,0.001)},
      {code:"USDJPY", name:"USD/JPY",    last:156.42,  day:-0.0018, region:"FX",   spark:genSpark(19,-0.001)},
      {code:"VIX",    name:"VIX",        last:14.82,   day:0.0210,  region:"US",   spark:genSpark(23,0.01)},
      {code:"JP10Y",  name:"JGB 10Y",    last:1.428,   day:0.0140,  region:"Rate", unit:"%", spark:genSpark(29,0.007)},
      {code:"GOLD",   name:"Gold (¥/g)", last:14852,   day:0.0034,  region:"Comm", spark:genSpark(31,0.002)},
    ];
    var insights = [

       action:"Learn more"},

      {time:"--:--",src:"INFO",  text:"Upload your PayPay Securities Excel file to view your portfolio"},

      {time:"--:--",src:"TIP",   text:"Your data stays local — nothing is sent to any server"},

      riskDecomp:   [],

      market:       market,

  <!-- ── Excel Parser ── -->
  <script>
  window.parsePayPayExcel = function(workbook) {
    var PS_ALIASES = {
      company:      ["Company / Fund Name","Company name","Company Name","Company","銘柄名","銘柄"],
      total_bought: ["Total Bought (¥)","Total Bought","買付合計","購入合計"],
      total_sold:   ["Total Sold (¥)","Total Sold","売却合計"],
      net_invested: ["Net Invested (¥)","Net Invested","純投資額"],
      dividends:    ["Dividends / Dist. (¥)","Dividends (¥)","Dividends","配当金"],
      buy_trades:   ["Buy Trades","買付回数"],
      last_purchase:["Last Purchase","最終購入日"],
    };
    var TH_ALIASES = {
      date:   ["Date","日付","取引日"],
      company:["Company / Fund","Company/Fund","Company","Company Name","銘柄名"],
      amount: ["Amount (¥)","Amount","金額"],
      type_en:["Type (EN)","Type EN","Type_EN","Transaction Type","Type","取引種別"],
    };
    var DT_ALIASES = {
      company: ["Company / Fund","Company/Fund","Company","Company Name","銘柄名"],
      received:["Total Received (¥)","Total Received","配当合計"],
    };
    function parseSheet(name, headerRow) {
      var s = workbook.Sheets[name]; if (!s) return [];
      var all = XLSX.utils.sheet_to_json(s,{header:1,raw:false,defval:""});
      if (all.length <= headerRow) return [];
      var hdrs = (all[headerRow]||[]).map(function(h){return String(h||"").trim();});
      return all.slice(headerRow+1).map(function(row){
        var obj={};
        hdrs.forEach(function(h,i){if(h)obj[h]=String(row[i]||"").trim();});
        return obj;
      }).filter(function(r){return Object.values(r).some(function(v){return v!=="";});});
    }
    function remap(rows, aliases) {
      return rows.map(function(row){
        var out={};
        Object.entries(aliases).forEach(function(entry){
          var key=entry[0],names=entry[1];
          for(var i=0;i<names.length;i++){if(names[i] in row && row[names[i]]!==""){out[key]=row[names[i]];break;}}
        });
        return out;
      });
    }
    function num(s){return parseFloat(String(s||"0").replace(/,/g,""))||0;}
    function fmtN(n){return Math.round(n).toLocaleString();}
    var psRaw = remap(parseSheet("Portfolio Summary",3),   PS_ALIASES);
    var thRaw = remap(parseSheet("Transaction History",1), TH_ALIASES);
    var dtRaw = remap(parseSheet("Dividend Tracker",1),   DT_ALIASES);
    var ps = psRaw.filter(function(r){return r.company && !String(r.company).match(/^[▶▼TOTAL合計]/);})
      .map(function(r){return {company:String(r.company||"").trim(),total_bought:num(r.total_bought),total_sold:num(r.total_sold),net_invested:num(r.net_invested),dividends:num(r.dividends),buy_trades:parseInt(String(r.buy_trades||"0").replace(/,/g,""))||0,last_purchase:r.last_purchase||""};})
      .filter(function(r){return r.company && r.total_bought>0;});
    var th = thRaw.filter(function(r){return r.date&&r.company;})
      .map(function(r){return {date:r.date,company:String(r.company||"").trim(),amount:num(r.amount),type_en:String(r.type_en||"").trim()};})
      .filter(function(r){return r.amount>0;});
    var dt = dtRaw.filter(function(r){return r.company;})
      .map(function(r){return {company:String(r.company||"").trim(),received:num(r.received)};})
      .filter(function(r){return r.company&&r.received>0;})
      .sort(function(a,b){return b.received-a.received;});
    var total_cost=ps.reduce(function(s,r){return s+r.total_bought;},0);
    var total_sold_sum=ps.reduce(function(s,r){return s+r.total_sold;},0);
    var total_net=ps.reduce(function(s,r){return s+r.net_invested;},0);
    var total_divs=ps.reduce(function(s,r){return s+r.dividends;},0);
    var total_trades=ps.reduce(function(s,r){return s+r.buy_trades;},0);
    var buyTxs=th.filter(function(r){return r.type_en.toLowerCase().includes("buy");}).length;
    var sellTxs=th.filter(function(r){return r.type_en.toLowerCase().includes("sell");}).length;
    function genSpark(seed,drift){drift=drift||0;var out=[],s=seed,v=100;for(var i=0;i<30;i++){s=(s*9301+49297)%233280;v*=1+drift+(s/233280-0.5)*0.022;out.push(v);}return out;}
    function genSeries(len,drift,vol,seed){var out=[],v=100,s=seed;for(var i=0;i<len;i++){s=(s*9301+49297)%233280;v*=1+drift+(s/233280-0.5)*vol;out.push(v);}return out;}
    var holdings = ps.map(function(r,idx){return {code:String(idx+1).padStart(3,"0"),name:r.company,en:r.company,sector:"—",account:"tokutei",total_bought:r.total_bought,total_sold:r.total_sold,net_invested:r.net_invested,dividends:r.dividends,buy_trades:r.buy_trades,last_purchase:r.last_purchase,cost:r.total_bought,mv:r.net_invested,pnl:r.total_sold+r.dividends-r.total_bought,pnlPct:r.total_bought>0?(r.total_sold+r.dividends-r.total_bought)/r.total_bought:0,dayPnl:0,day:0,last:0,shares:0,avg:0,yield:r.total_bought>0?r.dividends/r.total_bought:0,divAnnual:r.dividends,weight:total_cost>0?r.total_bought/total_cost:0,spark:genSpark(idx*37+11,0)};});
    var portSeries=genSeries(252,0.00060,0.010,42),topixSeries=genSeries(252,0.00055,0.009,13),nikkeiSeries=genSeries(252,0.00072,0.010,19);
    var equity=portSeries.map(function(v){return total_cost*(v/100);});
    var today=new Date(),dates=Array.from({length:252},function(_,i){var d=new Date(today);d.setDate(d.getDate()-(251-i));return d;});
    var sectors=[{name:"Portfolio",mv:total_cost,pct:1}];
    var activity=th.slice(0,12).map(function(r){return {type:r.type_en.toLowerCase().includes("buy")?"buy":r.type_en.toLowerCase().includes("sell")?"sell":"div",date:r.date,name:r.company,code:"",amount:r.amount,account:"tokutei",shares:0,price:0};});
    var dividends=dt.slice(0,8).map(function(r){return {name:r.company,code:"",date:"",gross:r.received,net:r.received,account:"tokutei",perShare:0,shares:0};});
    var risk={sharpe:0,sortino:0,maxDD:0,volAnn:0,beta:1,alpha:0,var95:0,riskScore:50,riskLabel:"Connect tickers for live analytics",winRate:0,avgWin:0,avgLoss:0,profitFactor:0};
    var topH=[].concat(holdings).sort(function(a,b){return b.total_bought-a.total_bought;}).slice(0,6);
    var riskDecomp=topH.map(function(h){return {code:h.code,name:h.name,en:h.en,sector:h.sector,weight:h.weight,vol:0.20,contrib:h.weight*0.20,pct:h.weight};});
    var corrSyms=holdings.slice(0,8);
    var corrMatrix=corrSyms.map(function(_,i){return corrSyms.map(function(__,j){return i===j?1.0:parseFloat((0.25+((i*3+j*7)%5)*0.09).toFixed(2));});});
    var divYield=total_cost>0?(total_divs/total_cost*100).toFixed(2):"0.00";
    var topDiv=dt[0]?dt[0].company:"—";
    var nowStr=new Date().toTimeString().slice(0,5);
    var market=[
      {code:"TOPIX",  name:"TOPIX",      last:0,day:0,region:"JP",   spark:genSpark(3)},
      {code:"NKY",    name:"Nikkei 225", last:0,day:0,region:"JP",   spark:genSpark(7)},
      {code:"SPX",    name:"S&P 500",    last:0,day:0,region:"US",   spark:genSpark(11)},

  <!-- ── Charts ── -->
  <script type="text/babel">
function EquityCurve({data,ccy,period}){
  if(!data.equity||data.equity.length<2||data.equity.every(v=>v===0)){
    return(<div className="card card--glow" style={{display:"grid",placeItems:"center",height:200}}><div style={{color:"var(--muted)",fontSize:13}}>Upload Excel to see equity curve</div></div>);
  }
  const periodMap={"1D":5,"1W":5,"1M":22,"3M":66,"YTD":110,"1Y":252,"ALL":252};
  const n=periodMap[period]||252,equity=data.equity.slice(-n),topix=data.topixSeries.slice(-n).map(v=>v/data.topixSeries.slice(-n)[0]*equity[0]),nikkei=data.nikkeiSeries.slice(-n).map(v=>v/data.nikkeiSeries.slice(-n)[0]*equity[0]),dates=data.dates.slice(-n);
  const W=1000,H=320,PL=60,PR=18,PT=20,PB=32,innerW=W-PL-PR,innerH=H-PT-PB;
  const all=[...equity,...topix,...nikkei],minV=Math.min(...all),maxV=Math.max(...all),pad=(maxV-minV)*0.08,yMin=minV-pad,yMax=maxV+pad;
  const x=i=>PL+(i/(equity.length-1))*innerW,y=v=>PT+(1-(v-yMin)/(yMax-yMin))*innerH;
  const path=arr=>arr.map((v,i)=>(i===0?"M":"L")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const fillP=arr=>path(arr)+` L ${x(arr.length-1).toFixed(1)} ${H-PB} L ${x(0).toFixed(1)} ${H-PB} Z`;
  const yTicks=[];for(let i=0;i<=4;i++)yTicks.push(yMin+((yMax-yMin)/4)*i);
  const xTickIdxs=[0,Math.floor(equity.length*0.25),Math.floor(equity.length*0.5),Math.floor(equity.length*0.75),equity.length-1];
  const [hover,setHover]=React.useState(null),svgRef=React.useRef(null);
  function onMove(e){const r=svgRef.current.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(equity.length-1,Math.round((px-PL)/innerW*(equity.length-1))));setHover(i);}
  const portReturn=(equity[equity.length-1]-equity[0])/equity[0];
  return(<div className="card card--glow" style={{overflow:"hidden",height:"100%"}}><CardHd eyebrow="Performance Analytics" title="Equity Curve" sub={`Portfolio value · ${period}`} right={<div style={{display:"flex",alignItems:"center",gap:14}}>{[{l:"Portfolio",c:"var(--cyan)",v:portReturn,w:2.5,dash:null},{l:"TOPIX",c:"#94A3B8",v:(topix[topix.length-1]-topix[0])/topix[0],w:1.2,dash:"5 3"},{l:"Nikkei 225",c:"#F59E0B",v:(nikkei[nikkei.length-1]-nikkei[0])/nikkei[0],w:1.2,dash:"2 3"}].map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:7,fontSize:11.5}}><span style={{width:18,height:0,borderTop:`${s.w}px ${s.dash?"dashed":"solid"} ${s.c}`}}/><span style={{color:"var(--text-2)"}}>{s.l}</span><span className={"mono "+(s.v>=0?"pos":"neg")} style={{fontWeight:500}}>{s.v>=0?"+":""}{(s.v*100).toFixed(2)}%</span></div>))}</div>}/><div style={{padding:"12px 16px 16px"}}><svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,display:"block",cursor:"crosshair"}} onMouseMove={onMove} onMouseLeave={()=>setHover(null)}><defs><linearGradient id="ec-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#06B6D4" stopOpacity="0.35"/><stop offset="60%" stopColor="#06B6D4" stopOpacity="0.05"/><stop offset="100%" stopColor="#06B6D4" stopOpacity="0"/></linearGradient><linearGradient id="ec-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#3B82F6"/><stop offset="100%" stopColor="#06B6D4"/></linearGradient></defs>{yTicks.map((t,i)=>(<g key={i}><line x1={PL} x2={W-PR} y1={y(t)} y2={y(t)} stroke="var(--grid)"/><text x={PL-10} y={y(t)+3} fontSize="10" fontFamily="JetBrains Mono" textAnchor="end" fill="var(--muted)">{SYM_T[ccy]}{((t*FX_T[ccy])/1e6).toFixed(1)}M</text></g>))}{xTickIdxs.map((idx,i)=>(<text key={i} x={x(idx)} y={H-10} fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle" fill="var(--muted)">{dates[idx].toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</text>))}<path d={path(topix)} fill="none" stroke="#94A3B8" strokeWidth="1.2" strokeDasharray="5 3" opacity="0.7"/><path d={path(nikkei)} fill="none" stroke="#F59E0B" strokeWidth="1.2" strokeDasharray="2 3" opacity="0.6"/><path d={fillP(equity)} fill="url(#ec-fill)"/><path d={path(equity)} fill="none" stroke="url(#ec-line)" strokeWidth="2.5" style={{filter:"drop-shadow(0 0 6px rgba(6,182,212,0.6))"}}/><circle cx={x(equity.length-1)} cy={y(equity[equity.length-1])} r="4" fill="var(--cyan)" style={{filter:"drop-shadow(0 0 6px var(--cyan))"}}/>{hover!=null&&(<g><line x1={x(hover)} x2={x(hover)} y1={PT} y2={H-PB} stroke="var(--cyan)" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/><circle cx={x(hover)} cy={y(equity[hover])} r="4.5" fill="var(--bg)" stroke="var(--cyan)" strokeWidth="2"/></g>)}</svg></div></div>);
}
function AllocationDonut({data,ccy}){
  if(!data.sectors||data.sectors.length===0){return(<div className="card" style={{display:"grid",placeItems:"center",height:200}}><div style={{color:"var(--muted)",fontSize:13}}>No sector data</div></div>);}
  const {sectors,total_mv}=data;
  const COLORS={"Tech":"#06B6D4","Financial":"#3B82F6","Industrial":"#8B5CF6","Auto":"#F59E0B","Trading":"#10B981","Telecom":"#EC4899","Materials":"#64748B","Healthcare":"#84CC16","Services":"#F97316","Portfolio":"#06B6D4"};
  const R_OUT=92,R_IN=60,CX=110,CY=110;
  let acc=0;const segs=sectors.map(s=>{const start=acc;acc+=s.pct;return{...s,start,end:acc,color:COLORS[s.name]||"#64748B"};});
  function arc(start,end,ri=R_IN,ro=R_OUT){const a0=start*2*Math.PI-Math.PI/2,a1=end*2*Math.PI-Math.PI/2,x0=CX+ro*Math.cos(a0),y0=CY+ro*Math.sin(a0),x1=CX+ro*Math.cos(a1),y1=CY+ro*Math.sin(a1),x2=CX+ri*Math.cos(a1),y2=CY+ri*Math.sin(a1),x3=CX+ri*Math.cos(a0),y3=CY+ri*Math.sin(a0),large=(end-start)>0.5?1:0;return `M ${x0} ${y0} A ${ro} ${ro} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${ri} ${ri} 0 ${large} 0 ${x3} ${y3} Z`;}
  const [hover,setHover]=React.useState(null);
  return(<div className="card" style={{overflow:"hidden",height:"100%"}}><CardHd eyebrow="Asset Allocation" title="Sector Exposure" sub="By market value"/><div style={{padding:16,display:"flex",alignItems:"center",gap:18}}><svg width="220" height="220" viewBox="0 0 220 220" style={{flexShrink:0}}>{segs.map((s,i)=>(<path key={i} d={arc(s.start,s.end)} fill={s.color} opacity={hover!=null&&hover!==i?0.4:1} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} style={{transition:"all 200ms",filter:hover===i?`drop-shadow(0 0 10px ${s.color})`:"none",cursor:"pointer"}}/>))}<text x={CX} y={CY-6} textAnchor="middle" fontSize="9.5" fill="var(--muted)" fontFamily="JetBrains Mono" letterSpacing="0.1em">{hover!=null?segs[hover].name.toUpperCase():"TOTAL"}</text><text x={CX} y={CY+14} textAnchor="middle" fontSize="18" fontWeight="600" fill="var(--text)" fontFamily="JetBrains Mono">{hover!=null?(segs[hover].pct*100).toFixed(1)+"%":fmtJPY(total_mv,ccy,true)}</text><text x={CX} y={CY+30} textAnchor="middle" fontSize="10" fill="var(--muted)" fontFamily="Inter">{hover!=null?fmtJPY(segs[hover].mv,ccy,true):sectors.length+" sectors"}</text></svg><div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>{segs.map((s,i)=>(<div key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} style={{display:"flex",alignItems:"center",gap:10,fontSize:12,padding:"3px 0",opacity:hover!=null&&hover!==i?0.5:1,transition:"opacity 160ms",cursor:"pointer"}}><span style={{width:8,height:8,borderRadius:2,background:s.color,boxShadow:`0 0 6px ${s.color}`,flexShrink:0}}/><span style={{flex:1,color:"var(--text-2)"}}>{s.name}</span><span className="mono" style={{color:"var(--muted)",fontSize:11}}>{fmtJPY(s.mv,ccy,true)}</span><span className="mono" style={{width:46,textAlign:"right",color:"var(--text)",fontWeight:500}}>{(s.pct*100).toFixed(1)}%</span></div>))}</div></div></div>);
}
function RiskDecomp({data,ccy}){
  if(!data.riskDecomp||data.riskDecomp.length===0){return(<div className="card" style={{display:"grid",placeItems:"center",height:200}}><div style={{color:"var(--muted)",fontSize:13}}>No risk data available</div></div>);}

function CorrelationHeatmap({data}){

}
Object.assign(window,{EquityCurve,AllocationDonut,RiskDecomp,CorrelationHeatmap});

  const sevMeta={warn:{color:"var(--warn)",bg:"rgba(245,158,11,0.06)",border:"rgba(245,158,11,0.3)",glow:"rgba(245,158,11,0.25)"},ok:{color:"var(--cyan)",bg:"rgba(6,182,212,0.06)",border:"rgba(6,182,212,0.3)",glow:"rgba(6,182,212,0.25)"},info:{color:"var(--blue)",bg:"rgba(59,130,246,0.06)",border:"rgba(59,130,246,0.3)",glow:"rgba(59,130,246,0.25)"}};
  const kindLabel={risk:"RISK",opportunity:"OPPORTUNITY",alert:"ALERT",performance:"PERFORMANCE"};
  return(<div className="card card--glow" style={{overflow:"hidden",height:"100%"}}><div style={{padding:"14px 16px 12px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"linear-gradient(90deg,rgba(6,182,212,0.06),transparent 60%)"}}><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#3B82F6,#06B6D4)",display:"grid",placeItems:"center",boxShadow:"0 0 16px -2px rgba(6,182,212,0.5)"}}><svg viewBox="0 0 20 20" width="16" height="16" fill="none"><path d="M10 2L11.5 7L16 8L11.5 9L10 14L8.5 9L4 8L8.5 7Z" fill="white"/><circle cx="16" cy="3" r="1" fill="white"/></svg></div><div><div className="font-display" style={{fontSize:15,fontWeight:600,display:"flex",alignItems:"center",gap:8}}>AI Insights<span className="pill pill--cyan" style={{fontSize:9,padding:"2px 6px"}}>BETA</span></div><div style={{fontSize:11,color:"var(--muted)",marginTop:1}}>{insights.length} active signals</div></div></div></div><div style={{padding:12,display:"flex",flexDirection:"column",gap:10}}>{insights.map((ins,i)=>{const sm=sevMeta[ins.severity]||sevMeta.info;return(<div key={i} style={{padding:12,background:sm.bg,border:`1px solid ${sm.border}`,borderRadius:10,animation:`fadeup 400ms ease-out ${i*80}ms backwards`}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,gap:8}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:9,fontWeight:700,letterSpacing:"0.12em",color:sm.color,padding:"2px 7px",background:"rgba(0,0,0,0.25)",border:`1px solid ${sm.border}`,borderRadius:3}}>{kindLabel[ins.kind]||"INFO"}</span><span style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>{ins.title}</span></div></div><div style={{fontSize:11.5,color:"var(--text-2)",lineHeight:1.5,marginBottom:8}}>{ins.body}</div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:10.5,color:"var(--muted)"}}>Action · <span style={{color:sm.color,fontWeight:500}}>{ins.action}</span></span></div></div>);})}</div><style>{`@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}`}</style></div>);
}
function Watchlist({data,ccy}){
  const {watchlist}=data;
  if(!watchlist||watchlist.length===0){return(<div className="card" style={{display:"grid",placeItems:"center",height:160}}><div style={{color:"var(--muted)",fontSize:13}}>No watchlist items</div></div>);}
  return(<div className="card" style={{overflow:"hidden",height:"100%"}}><CardHd eyebrow="Watchlist" title="Tracking" sub={watchlist.length+" symbols"} right={<button className="btn btn--ghost" style={{fontSize:11.5}}>+ Add</button>}/><div>{watchlist.map((w,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderBottom:i<watchlist.length-1?"1px solid var(--border)":"none",transition:"background 160ms",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(59,130,246,0.04)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}><div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"center",gap:6}}><span className="mono" style={{fontSize:11,color:"var(--muted)"}}>{w.code}</span><span style={{fontSize:13,fontWeight:500}}>{w.en}</span></div>{w.alert&&(<div style={{fontSize:10.5,color:"var(--warn)",marginTop:2}}>{w.alert}</div>)}</div><div style={{textAlign:"right",minWidth:84}}><div className="mono" style={{fontSize:12.5,fontWeight:500}}>{fmtJPY(w.last,ccy)}</div><div style={{marginTop:2}}><span className={"mono "+(w.day>=0?"pos":"neg")} style={{fontSize:11}}>{w.day>=0?"+":""}{(w.day*100).toFixed(2)}%</span></div></div></div>))}</div></div>);
}
function MarketOverview({data}){
  const {market}=data;
  const regionColor={JP:"var(--cyan)",US:"var(--blue)",FX:"var(--warn)",Rate:"#A78BFA",Comm:"#F97316"};
  return(<div className="card" style={{overflow:"hidden",height:"100%"}}><CardHd eyebrow="Markets" title="Market Overview" sub="Indices · FX · Rates"/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0}}>{market.map((m,i)=>(<div key={i} style={{padding:"12px 14px",borderRight:i%2===0?"1px solid var(--border)":"none",borderBottom:i<market.length-2?"1px solid var(--border)":"none",position:"relative",overflow:"hidden"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><span style={{fontSize:9,fontWeight:600,color:regionColor[m.region],letterSpacing:"0.08em",textTransform:"uppercase"}}>{m.region}</span><span style={{fontSize:12,fontWeight:500,color:"var(--text)"}}>{m.name}</span></div><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}><div className="mono" style={{fontSize:16,fontWeight:500}}>{m.last===0?"—":m.last.toLocaleString(undefined,{maximumFractionDigits:m.last<100?2:0})}{m.unit&&<span style={{fontSize:11,color:"var(--muted)",marginLeft:2}}>{m.unit}</span>}</div><div style={{color:m.day>=0?"var(--pos)":"var(--neg)"}} className="mono"><span style={{fontSize:11.5}}>{m.last===0?"—":(m.day>=0?"+":"")+((m.day*100).toFixed(2)+"%")}</span></div></div></div>))}</div></div>);
}
function NewsTicker({data}){
  const {news}=data;
  if(!news||news.length===0)return null;
  return(<div className="card" style={{padding:"10px 16px",display:"flex",alignItems:"center",gap:16,overflow:"hidden"}}><div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}><span style={{width:6,height:6,borderRadius:"50%",background:"var(--neg)",boxShadow:"0 0 8px var(--neg)",animation:"pulse-dot 1.6s ease-in-out infinite",display:"inline-block"}}/><span style={{fontSize:10,fontWeight:700,letterSpacing:"0.12em",color:"var(--neg)"}}>LIVE</span></div><div style={{flex:1,overflow:"hidden",position:"relative",maskImage:"linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)"}}><div style={{display:"inline-flex",gap:40,whiteSpace:"nowrap",animation:"scroll 60s linear infinite"}}>{[...news,...news].map((n,i)=>(<span key={i} style={{display:"inline-flex",alignItems:"center",gap:8,fontSize:12}}><span className="mono" style={{color:"var(--muted)"}}>{n.time}</span><span style={{color:"var(--cyan)",fontWeight:600,fontSize:10,letterSpacing:"0.08em"}}>{n.src.toUpperCase()}</span><span style={{color:"var(--text-2)"}}>{n.text}</span></span>))}</div></div><style>{`@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}`}</style></div>);
}
function TVModal({ticker,name,onClose}){
  if(!ticker)return null;
  const src="https://s.tradingview.com/widgetembed/?symbol=TSE%3A"+ticker+"&interval=D&theme=dark&style=1&timezone=Asia%2FTokyo&locale=en&toolbar_bg=%23050816&hide_side_toolbar=0&allow_symbol_change=1&save_image=0";

    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={onClose}>

        <div style={{padding:"10px 16px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(10,18,40,0.9)",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span className="mono" style={{fontSize:15,fontWeight:700,color:"var(--cyan)"}}>{ticker}</span>
            <span style={{fontSize:13,color:"var(--text-2)",maxWidth:320,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{name}</span>
            <span style={{fontSize:10,color:"var(--muted)",background:"rgba(59,130,246,0.12)",border:"1px solid rgba(59,130,246,0.25)",padding:"2px 7px",borderRadius:4}}>TSE · TradingView</span>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:"1px solid var(--border)",color:"var(--muted)",padding:"5px 12px",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit",transition:"all 140ms"}} onMouseEnter={e=>e.currentTarget.style.borderColor="var(--cyan)"} onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border)"}>✕ Close</button>
        </div>
        <iframe src={src} style={{flex:1,border:"none",width:"100%",display:"block"}} title={"TradingView "+ticker}/>
      </div>

}
window.TVModal=TVModal;

function HoldingsTerm({data,ccy,limit}){
  const isPayPay=data.mode==="paypay";
  const defaultSort=isPayPay?"total_bought":"mv";
  const [sortBy,setSortBy]=React.useState(defaultSort);
  const [dir,setDir]=React.useState("desc");
  const [tvStock,setTvStock]=React.useState(null);
  function toggle(col){if(sortBy===col)setDir(d=>d==="asc"?"desc":"asc");else{setSortBy(col);setDir("desc");}}
  if(!data.holdings||data.holdings.length===0){return(<div className="card" style={{display:"grid",placeItems:"center",height:120}}><div style={{color:"var(--muted)",fontSize:13}}>No holdings — upload your Excel to see positions</div></div>);}
  let rows=[...data.holdings].sort((a,b)=>{const va=a[sortBy],vb=b[sortBy],c=typeof va==="string"?va.localeCompare(vb):(va-vb);return dir==="asc"?c:-c;});
  if(limit)rows=rows.slice(0,limit);
  const HCol=({id,children,align="right"})=>(<th onClick={()=>toggle(id)} style={{textAlign:align,cursor:"pointer",userSelect:"none",color:sortBy===id?"var(--text)":"var(--muted)"}}>{children}{sortBy===id&&<span style={{fontSize:9,marginLeft:3}}>{dir==="asc"?"▲":"▼"}</span>}</th>);
  if(isPayPay){
    return(<>{tvStock&&<TVModal ticker={tvStock.ticker} name={tvStock.name} onClose={()=>setTvStock(null)}/>}<div className="card" style={{overflow:"hidden"}}><CardHd eyebrow="Portfolio" title="Holdings" sub={`${data.holdings.length} positions · PayPay Securities`} right={<span style={{fontSize:10.5,color:"var(--cyan)",background:"rgba(6,182,212,0.10)",border:"1px solid rgba(6,182,212,0.25)",padding:"3px 8px",borderRadius:4,fontWeight:600}}>LIVE DATA</span>}/><div style={{overflow:"auto",maxHeight:limit?"none":560}}><table className="term"><thead><tr><HCol id="name" align="left">Company</HCol><HCol id="total_bought">Total Bought</HCol><HCol id="total_sold">Total Sold</HCol><HCol id="net_invested">Net Invested</HCol><HCol id="dividends">Dividends</HCol><HCol id="last">Price</HCol><HCol id="day">Day%</HCol><HCol id="buy_trades">Trades</HCol><HCol id="weight">Weight</HCol><th style={{textAlign:"right"}}>Chart</th><th style={{textAlign:"right"}}>Trend</th></tr></thead><tbody>{rows.map((h,idx)=>(<tr key={idx}><td style={{textAlign:"left"}}><div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:30,height:30,borderRadius:6,background:"rgba(59,130,246,0.10)",border:"1px solid rgba(59,130,246,0.20)",display:"grid",placeItems:"center",fontFamily:"JetBrains Mono",fontSize:9,fontWeight:600,color:"var(--cyan)",flexShrink:0}}>{idx+1}</div><span style={{fontSize:12.5,fontWeight:500,color:"var(--text)"}}>{h.name}</span></div></td><td className="mono" style={{textAlign:"right",fontWeight:500,color:"var(--text-2)"}}>{fmtJPY(h.total_bought,ccy)}</td><td className="mono" style={{textAlign:"right",fontWeight:500,color:h.total_sold>0?"var(--warn)":"var(--muted)"}}>{h.total_sold>0?fmtJPY(h.total_sold,ccy):"—"}</td><td className="mono" style={{textAlign:"right",fontWeight:600,color:"var(--pos)"}}>{fmtJPY(h.net_invested,ccy)}</td><td className="mono" style={{textAlign:"right",fontWeight:600,color:h.dividends>0?"var(--warn)":"var(--muted)"}}>{h.dividends>0?fmtJPY(h.dividends,ccy):"—"}</td><td className="mono" style={{textAlign:"right",fontWeight:500,color:h.last>0?"var(--text)":"var(--muted)"}}>{h.last>0?fmtJPY(h.last,ccy):"—"}</td><td style={{textAlign:"right",minWidth:58}}>{h.last>0?<span className={"mono "+(h.day>=0?"pos":"neg")} style={{fontSize:11}}>{h.day>=0?"+":""}{(h.day*100).toFixed(2)}%</span>:<span style={{color:"var(--muted)",fontSize:11}}>—</span>}</td><td className="mono" style={{textAlign:"right",color:"var(--text-2)"}}>{h.buy_trades}</td><td style={{textAlign:"right"}}><div style={{display:"inline-flex",alignItems:"center",gap:6}}><div style={{width:44}}><MiniMeter value={h.weight} max={0.25} color="var(--cyan)" height={3}/></div><span className="mono" style={{fontSize:11,color:"var(--text-2)",width:34,textAlign:"right"}}>{(h.weight*100).toFixed(1)}%</span></div></td><td style={{textAlign:"right",padding:"10px 6px"}}><button onClick={()=>{const c=window.resolveTicker&&window.resolveTicker(h.name);if(c)setTvStock({ticker:c,name:h.name});else window.open('https://www.tradingview.com/','_blank');}} style={{background:"transparent",border:"1px solid var(--border)",color:"var(--cyan)",padding:"3px 8px",borderRadius:5,cursor:"pointer",fontSize:12,lineHeight:1,fontFamily:"inherit",transition:"border-color 140ms"}} title="Open TradingView chart">📈</button></td><td style={{textAlign:"right"}}><div style={{display:"flex",justifyContent:"flex-end",color:"var(--cyan)"}}><Spark values={h.spark||[]} width={52} height={20} color="currentColor" glow={false} strokeWidth={1.2} filled={false}/></div></td></tr>))}</tbody></table></div></div></>);
  }
  return(<div className="card" style={{overflow:"hidden"}}><CardHd eyebrow="Portfolio" title="Holdings" sub={`${data.holdings.length} positions`}/><div style={{overflow:"auto",maxHeight:540}}><table className="term"><thead><tr><HCol id="code" align="left">Symbol</HCol><HCol id="mv">Market Value</HCol><HCol id="pnl">P/L</HCol><HCol id="pnlPct">Return</HCol><HCol id="weight">Weight</HCol></tr></thead><tbody>{rows.map(h=>(<tr key={h.code}><td style={{textAlign:"left"}}><span style={{fontSize:12.5,fontWeight:500}}>{h.en||h.name}</span></td><td className="mono" style={{textAlign:"right",fontWeight:500}}>{fmtJPY(h.mv,ccy)}</td><td style={{textAlign:"right"}}><span className={"mono "+(h.pnl>=0?"pos":"neg")} style={{fontWeight:500}}>{h.pnl>=0?"+":"−"}{fmtJPY(Math.abs(h.pnl),ccy,true)}</span></td><td style={{textAlign:"right"}}><span className={"mono "+(h.pnlPct>=0?"pos":"neg")} style={{fontWeight:500}}>{h.pnlPct>=0?"+":""}{(h.pnlPct*100).toFixed(2)}%</span></td><td style={{textAlign:"right"}}><span className="mono" style={{fontSize:11.5,color:"var(--text-2)"}}>{(h.weight*100).toFixed(1)}%</span></td></tr>))}</tbody></table></div></div>);
}
Object.assign(window,{AIInsights,Watchlist,MarketOverview,NewsTicker,HoldingsTerm});
  </script>

  <!-- ── App Shell ── -->
  <script type="text/babel">
function WelcomeScreen({onUpload}){
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"60vh",gap:32,padding:"48px 24px"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:72,height:72,borderRadius:20,background:"linear-gradient(135deg,#3B82F6,#06B6D4)",display:"grid",placeItems:"center",margin:"0 auto 24px",boxShadow:"0 0 40px -8px rgba(6,182,212,0.6)"}}>
          <svg viewBox="0 0 20 20" width="36" height="36" fill="none"><path d="M3 14L7 9L11 12L17 5" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><circle cx="17" cy="5" r="1.5" fill="white"/></svg>
        </div>
        <div className="font-display" style={{fontSize:32,fontWeight:700,letterSpacing:"-0.03em",marginBottom:8}}>Portfolio Manager</div>
        <div className="mono" style={{fontSize:12,color:"var(--muted)",letterSpacing:"0.1em"}}>V3.1 · PAYPAY SECURITIES</div>
      </div>
      <div className="card card--gradient-edge" style={{padding:32,maxWidth:480,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:15,fontWeight:600,marginBottom:8}}>Upload your PayPay Excel file</div>
        <div style={{fontSize:13,color:"var(--muted)",marginBottom:24,lineHeight:1.6}}>Export from PayPay Securities → Portfolio → Excel (.xlsx)<br/>Your data stays local — nothing leaves your browser.</div>
        <label style={{display:"inline-flex",alignItems:"center",gap:10,padding:"12px 24px",background:"linear-gradient(180deg,#1E40AF,#1E3A8A)",border:"1px solid rgba(59,130,246,0.4)",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:600,color:"var(--text)",boxShadow:"0 6px 24px -6px rgba(59,130,246,0.5)",transition:"all 160ms"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 10px 32px -6px rgba(59,130,246,0.7)";}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="0 6px 24px -6px rgba(59,130,246,0.5)";}}>
          {I.upload} Upload Excel (.xlsx)
          <input type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={onUpload}/>
        </label>
      </div>
      <div className="grid-3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,maxWidth:600,width:"100%"}}>
        {[["Holdings","All your positions with totals","var(--cyan)"],["Dividends","Income history & yield","var(--pos)"],["Transactions","Full buy/sell history","var(--warn)"]].map(([t,s,c],i)=>(
          <div key={i} className="card" style={{padding:16,textAlign:"center"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:c,boxShadow:`0 0 8px ${c}`,margin:"0 auto 10px"}}/>
            <div style={{fontSize:12,fontWeight:600,marginBottom:4}}>{t}</div>
            <div style={{fontSize:11,color:"var(--muted)"}}>{s}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function BottomNav({active,setActive}){
  const items=[
    {id:"dashboard",label:"Home",    icon:I.dashboard},
    {id:"portfolio",label:"Holdings",icon:I.portfolio},
    {id:"analytics",label:"Charts",  icon:I.analytics},
    {id:"risk",     label:"Risk",    icon:I.risk},
    {id:"ai",       label:"AI",      icon:I.ai},
  ];
  return(
    <nav className="bnav">
      {items.map(it=>{
        const a=active===it.id;
        return(<button key={it.id} onClick={()=>setActive(it.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,background:a?"rgba(59,130,246,0.10)":"transparent",border:0,borderTop:`2px solid ${a?"var(--cyan)":"transparent"}`,color:a?"var(--cyan)":"var(--muted)",cursor:"pointer",fontFamily:"inherit",fontSize:9.5,fontWeight:a?600:400,padding:"8px 2px",transition:"all 140ms"}}>
          <span style={{display:"inline-flex",opacity:a?1:0.65}}>{it.icon}</span>
          <span>{it.label}</span>
        </button>);
      })}
    </nav>
  );
}

function App(){
  const [active,setActive]=React.useState("dashboard");
  const [period,setPeriod]=React.useState("YTD");
  const [ccy,setCcy]=React.useState("JPY");
  const [data,setData]=React.useState(()=>window.loadFromStorage()||window.TERMINAL_DATA);
  const [sideOpen,setSideOpen]=React.useState(false);

  React.useEffect(()=>{
    window.__setTerminalData=(newData)=>{window.TERMINAL_DATA=newData;window.saveToStorage(newData);setData(newData);};
    return()=>{delete window.__setTerminalData;};
  },[]);

  async function handleWelcomeUpload(e){
    const file=e.target.files[0]; if(!file)return;
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const parsed=window.parsePayPayExcel(wb);
      const enriched=await window.fetchPrices(parsed.holdings);
      const enrichedData=Object.assign({},parsed,{holdings:enriched});
      if(window.__setTerminalData)window.__setTerminalData(enrichedData);
    }catch(err){alert("Could not read Excel:\n"+err.message);}
    e.target.value="";
  }

  const isEmpty=!data.mode&&(!data.holdings||data.holdings.length===0);

  return(
    <div style={{display:"flex",minHeight:"100vh"}}>
      <div className={"mob-overlay"+(sideOpen?" vis":"")} onClick={()=>setSideOpen(false)}/>
      <Sidebar active={active} setActive={setActive} open={sideOpen} onClose={()=>setSideOpen(false)}/>
      <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column"}}>
        <Header period={period} setPeriod={setPeriod} ccy={ccy} setCcy={setCcy} asOf={data.asOf} onMenuClick={()=>setSideOpen(true)}/>
        <main className="main-pad" style={{padding:"20px 24px 32px",display:"flex",flexDirection:"column",gap:16}}>
          <NewsTicker data={data}/>
          {isEmpty?(
            <WelcomeScreen onUpload={handleWelcomeUpload}/>
          ):(
            <>
              {active==="dashboard"  && <Dashboard  data={data} ccy={ccy} period={period}/>}
              {active==="portfolio"  && <Portfolio  data={data} ccy={ccy} period={period}/>}
              {active==="analytics"  && <Analytics  data={data} ccy={ccy} period={period}/>}
              {active==="risk"       && <RiskView   data={data} ccy={ccy}/>}
              {active==="watchlist"  && <WatchView  data={data} ccy={ccy}/>}
              {active==="ai"         && <AIView     data={data} ccy={ccy}/>}
              {active==="backtest"   && <Backtest   data={data} ccy={ccy}/>}
              {active==="settings"   && <SettingsView data={data}/>}
            </>
          )}
        </main>
        <Footer asOf={data.asOf}/>
      </div>
      <BottomNav active={active} setActive={setActive}/>
    </div>
  );
}

function Dashboard({data,ccy,period}){
  return(<><KpiGrid data={data} ccy={ccy}/><div className="grid-2-1" style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}}><EquityCurve data={data} ccy={ccy} period={period}/><AIInsights data={data}/></div><div className="grid-3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}><AllocationDonut data={data} ccy={ccy}/><RiskDecomp data={data} ccy={ccy}/><MarketOverview data={data}/></div><HoldingsTerm data={data} ccy={ccy}/><div className="grid-2-1" style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}}><CorrelationHeatmap data={data}/><Watchlist data={data} ccy={ccy}/></div></>);
}
